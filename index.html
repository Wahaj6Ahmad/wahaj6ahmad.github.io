  <script>

  <script>
    (function () {
      const wrap = document.getElementById("navWrap");
      const toggle = document.getElementById("navToggle");
      const nav = document.getElementById("siteNav");
  
      if (!wrap || !toggle || !nav) return;
  
      function setOpen(open) {
        wrap.classList.toggle("is-open", open);
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
      }
  
      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        setOpen(!wrap.classList.contains("is-open"));
      });
  
      // Click outside closes (only matters when pinned open)
      document.addEventListener("click", (e) => {
        if (!wrap.classList.contains("is-open")) return;
        if (!wrap.contains(e.target)) setOpen(false);
      });
  
      // Esc closes
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setOpen(false);
      });
  
      // Optional: close after selecting a link on small screens
      nav.querySelectorAll("a").forEach((a) => {
        a.addEventListener("click", () => {
          if (window.matchMedia("(max-width: 860px)").matches) setOpen(false);
        });
      });
    })();
  </script>
  <div id="siteFooter"></div>
  <script src="/assets/js/layout.js" defer></script>
